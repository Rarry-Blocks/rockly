<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shapes Playground — grid</title>

    <script type="module">
      import {loadScript} from '../scripts/load.mjs';

      import * as Blockly from '../../build/blockly.loader.mjs';
      import '../../build/blocks.loader.mjs';

      await loadScript('../../build/msg/en.js');
      await loadScript('screenshot.js');

      const SHAPES = {HEXAGONAL: 1, ROUND: 2, SQUARE: 3, PILLOW: 4, BOWL: 5};

      function createBlocks() {
        Object.entries(SHAPES).forEach(([key, shape]) => {
          Blockly.Blocks[`${key}_LABEL`] = {
            init: function () {
              this.appendDummyInput().appendField('label');
              this.setOutput(true, null);
              this.setColour(230);
              this.setOutputShape(shape);
              this.setTooltip(`Label block for ${key}`);
            },
          };

          Blockly.Blocks[`${key}_INPUT`] = {
            init: function () {
              this.appendValueInput('IN0');
              this.setOutput(true, null);
              this.setColour(230);
              this.setOutputShape(shape);
              this.setTooltip(`Input block for ${key}`);
            },
          };
        });
      }

      function buildToolbox() {
        const xmlParts = ['<xml id="toolbox" style="display: none">'];
        Object.keys(SHAPES).forEach((key) =>
          xmlParts.push(
            `<block type="${key}_LABEL"></block>`,
            `<block type="${key}_INPUT"></block>`,
          ),
        );
        xmlParts.push('</xml>');
        return xmlParts.join('');
      }

      function createGridInWorkspace(workspace) {
        const keys = Object.keys(SHAPES);
        const cellW = 140;
        const cellH = 120;
        const startX = 20;
        const startY = 20;

        keys.forEach((labelKey, row) => {
          keys.forEach((inputKey, col) => {
            const inputBlock = workspace.newBlock(`${inputKey}_INPUT`);
            inputBlock.initSvg();
            inputBlock.render();

            const labelBlock = workspace.newBlock(`${labelKey}_LABEL`);
            labelBlock.initSvg();
            labelBlock.render();

            const inputConnection = inputBlock.getInput('IN0')?.connection;
            const labelConnection = labelBlock.outputConnection;
            if (inputConnection && labelConnection) {
              inputConnection.connect(labelConnection);
            }

            inputBlock.moveBy(startX + col * cellW, startY + row * cellH);
          });
        });

        try {
          workspace.zoomToFit();
        } catch (_) {}
      }

      function initZelosShapePlayground() {
        createBlocks();
        const toolboxXML = buildToolbox();
        document.body.insertAdjacentHTML('beforeend', toolboxXML);

        const workspace = Blockly.inject('root', {
          toolbox: document.getElementById('toolbox'),
          renderer: 'zelos',
          zoom: {controls: true, wheel: true},
          grid: {spacing: 25, length: 3, snap: false},
          comments: true,
          collapse: true,
          readOnly: false,
          move: {scrollbars: true, drag: true, wheel: false},
        });

        createGridInWorkspace(workspace);
      }

      initZelosShapePlayground();
    </script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
      }

      body {
        width: 100vw;
        height: 100vh;
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
